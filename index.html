<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#18314b"><meta name="description" content="Grammar, vocabulary and interactive English exercises in the Balmain English Learning Library."><title>Grammar &amp; Vocabulary | Balmain English Learning Library</title>
<style>
:root{color-scheme:light;--ink:#18314b;--teal:#2f6f6d;--teal-dark:#245856;--paper:#f4f2ec;--surface:#fff;--muted:#607080;--line:#d8dedf;--shadow:0 10px 28px rgba(24,49,75,.07)}*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,"Segoe UI",Arial,sans-serif}.shell{width:min(1440px,calc(100% - 48px));margin-inline:auto}.masthead{background:var(--ink);color:#fff;border-bottom:4px solid var(--teal)}.masthead-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.015em}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.35);border-radius:8px;color:#d9e8e5;font-family:Georgia,serif;font-size:1.2rem}.library-label{color:#d9e2e8;font-size:.88rem}main{padding:42px 0 64px}.intro{padding:0 0 28px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,4vw,2.8rem);font-weight:600;line-height:1.15;letter-spacing:-.025em}.lede{max-width:760px;margin:12px 0 0;color:var(--muted);font-size:1.02rem}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:24px 0 16px}.section-title{margin:0;font-size:1.05rem;font-weight:700}.count{margin-left:8px;color:var(--muted);font-size:.87rem;font-weight:500}.search{width:min(360px,100%);min-height:44px;padding:10px 14px;border:1px solid #bdc9cc;border-radius:8px;background:#fff;color:var(--ink);font:inherit}.search::placeholder{color:#72808b}.search:focus{outline:3px solid rgba(47,111,109,.2);border-color:var(--teal)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:0;margin:0;list-style:none}.grid li{min-width:0}.card{display:flex;min-height:108px;height:100%;flex-direction:column;justify-content:space-between;gap:14px;padding:15px 16px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-2px);border-color:#8eaaa8;background:#fbfdfc;box-shadow:0 12px 24px rgba(24,49,75,.11)}.card:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.card-title{font-size:.96rem;font-weight:650;line-height:1.35;overflow-wrap:anywhere}.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px solid #edf0ef;color:var(--muted);font-size:.75rem}.level{flex:none;padding:2px 7px;border-radius:999px;background:#e8f1ef;color:var(--teal-dark);font-size:.7rem;font-weight:750}.open{color:var(--teal-dark);font-weight:700}.message{grid-column:1/-1;padding:30px;border:1px dashed #b9c5c6;border-radius:9px;color:var(--muted);text-align:center;background:rgba(255,255,255,.55)}footer{padding:18px 0 26px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;text-align:center}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.shell{width:calc(100% - 32px)}main{padding-top:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:460px){.grid{grid-template-columns:1fr}.masthead-inner{min-height:64px}.library-label{font-size:.78rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header class="masthead"><div class="shell masthead-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div><div class="library-label">Learning Library</div></div></header><main class="shell"><section class="intro" aria-labelledby="page-title"><p class="eyebrow">English learning resources</p><h1 id="page-title">Grammar &amp; vocabulary</h1><p class="lede">A practical collection of language activities, from grammar foundations to specialist and professional vocabulary.</p></section><section aria-label="Exercise directory"><div class="toolbar"><h2 class="section-title">Explore the collection <span class="count" id="count" aria-live="polite">Loading…</span></h2><input class="search" id="search" type="search" placeholder="Search activities…" aria-label="Search activities" autocomplete="off"></div><ul class="grid" id="items" aria-live="polite" aria-busy="true"><li class="message">Loading activities…</li></ul></section></main><footer><div class="shell">Balmain English · Learning Library</div></footer>
<script>(()=>{const owner='Balmain-English',repo='grammar_vocabulary_etc',list=document.getElementById('items'),search=document.getElementById('search'),count=document.getElementById('count');let pages=[];const titleOf=p=>p.split('/').pop().replace(/\.html?$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());const levelOf=p=>{const m=p.match(/(?:^|[-_])(a1|a2|b1|b2|c1|c2)(?=[-_.]|$)/i);return m?m[1].toUpperCase():''};function render(){const q=search.value.trim().toLowerCase(),v=pages.filter(p=>p.title.toLowerCase().includes(q)||p.path.toLowerCase().includes(q));count.textContent=`${v.length} ${v.length===1?'activity':'activities'}`;list.replaceChildren();if(!v.length){const li=document.createElement('li');li.className='message';li.textContent=pages.length?'No activities match your search.':'No activities are available yet.';list.append(li);return}const f=document.createDocumentFragment();v.forEach(p=>{const li=document.createElement('li'),a=document.createElement('a');a.className='card';a.href='./'+p.path.split('/').map(encodeURIComponent).join('/');const t=document.createElement('span');t.className='card-title';t.textContent=p.title;const m=document.createElement('span');m.className='card-meta';const k=document.createElement('span');k.textContent=/quiz|test/i.test(p.title)?'Quiz / assessment':/vocab|vocabulary/i.test(p.title)?'Vocabulary':'Language practice';m.append(k);if(p.level){const l=document.createElement('span');l.className='level';l.textContent=p.level;m.append(l)}const o=document.createElement('span');o.className='open';o.textContent='Open →';m.append(o);a.append(t,m);li.append(a);f.append(li)});list.append(f)}fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{pages=(d.tree||[]).filter(x=>x.type==='blob'&&/\.html?$/i.test(x.path)&&!/^index\.html$/i.test(x.path.split('/').pop())).map(x=>({path:x.path,title:titleOf(x.path),level:levelOf(x.path)})).sort((a,b)=>a.title.localeCompare(b.title));list.setAttribute('aria-busy','false');render()}).catch(()=>{count.textContent='Activities unavailable';list.setAttribute('aria-busy','false');list.innerHTML='<li class="message">Unable to load activities right now. Please try again later.</li>'});search.addEventListener('input',render)})();</script></body></html>
