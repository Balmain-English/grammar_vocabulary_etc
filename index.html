<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18314b">
  <meta name="description" content="Vocabulary exercises in the Balmain English Learning Library.">
  <title>Vocabulary | Balmain English Learning Library</title>
  <style>
    :root{color-scheme:light;--ink:#18314b;--teal:#2f6f6d;--teal-dark:#245856;--paper:#f4f2ec;--surface:#fff;--muted:#607080;--line:#d8dedf;--shadow:0 8px 20px rgba(24,49,75,.07)}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif}
    .shell{width:min(1440px,calc(100% - 48px));margin-inline:auto}
    .masthead{background:var(--ink);color:#fff;border-bottom:4px solid var(--teal)}
    .masthead-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
    .brand-mark{display:grid;place-items:center;width:30px;height:30px;border:1px solid rgba(255,255,255,.35);border-radius:7px;color:#d9e8e5;font:1rem Georgia,serif}
    .library-label{color:#d9e2e8;font-size:.8rem}
    main{padding:32px 0 52px}
    .intro{padding-bottom:22px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 6px;color:var(--teal);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font:600 clamp(1.7rem,3vw,2.25rem)/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.02em}
    .lede{max-width:720px;margin:9px 0 0;color:var(--muted);font-size:.9rem}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0 14px}
    .section-title{margin:0;font-size:.95rem;font-weight:700}
    .count{margin-left:7px;color:var(--muted);font-size:.78rem;font-weight:500}
    .search{width:min(340px,100%);min-height:38px;padding:8px 12px;border:1px solid #bdc9cc;border-radius:7px;background:#fff;color:var(--ink);font:inherit}
    .search::placeholder{color:#72808b}
    .search:focus{outline:3px solid rgba(47,111,109,.2);border-color:var(--teal)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0;margin:0;list-style:none}
    .grid li{min-width:0}
    .card{display:flex;min-height:88px;height:100%;flex-direction:column;justify-content:space-between;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
    .card:hover{transform:translateY(-1px);border-color:#8eaaa8;background:#fbfdfc;box-shadow:0 9px 18px rgba(24,49,75,.1)}
    .card:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
    .card-title{font-size:.86rem;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
    .card-meta{display:flex;align-items:center;justify-content:space-between;gap:7px;padding-top:7px;border-top:1px solid #edf0ef;color:var(--muted);font-size:.68rem}
    .level{flex:none;padding:2px 6px;border-radius:999px;background:#e8f1ef;color:var(--teal-dark);font-size:.65rem;font-weight:700}
    .open{color:var(--teal-dark);font-weight:700;white-space:nowrap}
    .message{grid-column:1/-1;padding:24px;border:1px dashed #b9c5c6;border-radius:8px;background:rgba(255,255,255,.55);color:var(--muted);text-align:center}
    footer{padding:16px 0 22px;border-top:1px solid var(--line);color:var(--muted);font-size:.75rem;text-align:center}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:700px){.shell{width:calc(100% - 32px)}main{padding-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}
    @media(max-width:440px){.grid{grid-template-columns:1fr}.masthead-inner{min-height:60px}.library-label{font-size:.72rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="masthead"><div class="shell masthead-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div><div class="library-label">Learning Library</div></div></header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title"><p class="eyebrow">English learning resources</p><h1 id="page-title">Grammar &amp; vocabulary</h1><p class="lede">A practical collection of language activities, from grammar foundations to specialist and professional vocabulary.</p></section>
    <section aria-label="Exercise directory"><div class="toolbar"><h2 class="section-title">Explore the collection <span class="count" id="count" aria-live="polite">Loading…</span></h2><input class="search" id="search" type="search" placeholder="Search activities…" aria-label="Search activities" autocomplete="off"></div><ul class="grid" id="items" aria-live="polite" aria-busy="true"><li class="message">Loading activities…</li></ul></section>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (()=>{
      const owner='Balmain-English',repo='grammar_vocabulary_etc';
      const list=document.getElementById('items'),search=document.getElementById('search'),count=document.getElementById('count');
      let pages=[];
      const titleOf=path=>path.split('/').pop().replace(/\.html?$/i,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim().replace(/\b\w/g,c=>c.toUpperCase());
      const levelOf=path=>{const match=path.match(/(?:^|[-_])(a1|a2|b1|b2|c1|c2)(?=[-_.]|$)/i);return match?match[1].toUpperCase():''};
      function render(){
        const query=search.value.trim().toLowerCase();
        const visible=pages.filter(page=>page.title.toLowerCase().includes(query)||page.path.toLowerCase().includes(query));
        count.textContent=`${visible.length} ${visible.length===1?'activity':'activities'}`;
        list.replaceChildren();
        if(!visible.length){const item=document.createElement('li');item.className='message';item.textContent=pages.length?'No activities match your search.':'No activities are available yet.';list.append(item);return}
        const fragment=document.createDocumentFragment();
        visible.forEach(page=>{
          const item=document.createElement('li'),link=document.createElement('a');
          link.className='card';link.href='./'+page.path.split('/').map(encodeURIComponent).join('/');
          const title=document.createElement('span');title.className='card-title';title.textContent=page.title;
          const meta=document.createElement('span');meta.className='card-meta';
          const kind=document.createElement('span');kind.textContent=/quiz|test/i.test(page.title)?'Quiz / assessment':/vocab/i.test(page.title)?'Vocabulary':'Language practice';
          meta.append(kind);
          const level=page.level;if(level){const badge=document.createElement('span');badge.className='level';badge.textContent=level;meta.append(badge)}
          const open=document.createElement('span');open.className='open';open.textContent='Open ↗';meta.append(open);
          link.append(title,meta);item.append(link);fragment.append(item);
        });
        list.append(fragment);
      }
      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`)
        .then(response=>{if(!response.ok)throw new Error('Unable to load activities');return response.json()})
        .then(data=>{
          pages=(data.tree||[]).filter(file=>file.type==='blob'&&/\.html?$/i.test(file.path)&&!/index\.html$/i.test(file.path.split('/').pop())).map(file=>({path:file.path,title:titleOf(file.path),level:levelOf(file.path)})).sort((a,b)=>a.title.localeCompare(b.title));
          list.setAttribute('aria-busy','false');render();
        })
        .catch(()=>{count.textContent='Activities unavailable';list.setAttribute('aria-busy','false');list.innerHTML='<li class="message">Unable to load activities right now. Please try again later.</li>'});
      search.addEventListener('input',render);
    })();
  </script>
</body>
</html>
